<mat-drawer-container (backdropClick)="toggleNotificationDrawer(false)" class="md:!mt-75px
 md:relative overflow-hidden !bg-gray-100">
  <mat-drawer #drawer position="end" class="!fixed top-0 right-0 h-full !w-[80%] p-4 sm:!w-[80vw] md:!w-[60vw] xl:!w-[30vw]">
    <app-notification-menu></app-notification-menu>
  </mat-drawer>
  <mat-drawer-content>
    <mat-toolbar [ngClass]="{
      '!hidden': !isAuthenticated,
      ' md:fixed top-0 md:z-[1000] h-[75px]  w-full justify-between items-center': isAuthenticated,
      'md:rounded-full md:top-[4px] left-[240px] right-0 max-[768px]:left-0 max-[768px]:flex max-[768px]:items-center max-[768px]:justify-between': true
    }" color="primary">
      <button *ngIf="(isAuthenticated$ | async) && isMobile" class="text-black md:hidden" mat-icon-button
        (click)="toggleDrawer()">
        <mat-icon>menu</mat-icon>
      </button>
      <div
        *ngIf="currentRestaurant && !currentRestaurant.isActive && !isMobile"
        class="flex items-center bg-orange-100 border border-orange-400 text-orange-700 rounded-md px-3 py-3 mx-2"
        >
        <mat-icon class="text-orange-500 mr-1">warning</mat-icon>
        <span class="text-sm">
          Your subscription has expired.
          <a
            routerLink="/pricing"
            class="font-semibold underline text-orange-600 hover:text-orange-800"
          >
            Renew now
          </a>
        </span>
      </div>

      <div class="absolute left-[23px] right-0 bottom-0 rounded-bl-full">
        <app-progress-status></app-progress-status>
      </div>

      <div
        class="md:fixed last:md:mr-10 right-0 flex flex-row items-center gap-4 justify-self-end max-[768px]:ml-auto max-[325px]:gap-[5px]"
        [ngClass]="{
          'ml-[calc(100vw-150px)]': !isAuthenticated || isOnSpecificPage
        }">
        <app-notification-button *ngIf="(isAuthenticated$ | async)"
          (openNotificationMenu)="toggleNotificationDrawer(!$event)" [isOpen]="drawer.opened"></app-notification-button>
        <button class="text-black" mat-icon-button [matMenuTriggerFor]="accountMenu">
          <mat-icon>{{ accountManagement.icon }}</mat-icon>
        </button>
        <mat-menu #accountMenu="matMenu">
          <a *ngIf="!(isAuthenticated$ | async)" mat-menu-item [routerLink]="loginRoute.link"
            [routerLinkActive]="['is-active']">Login</a>
          <a *ngIf="isAuthenticated$ | async" mat-menu-item (click)="logout()">
            Logout
          </a>
          <a *ngIf="isAuthenticated$ | async" mat-menu-item (click)="openChangePasswordDialog()">Change Password</a>
        </mat-menu>
      </div>

    </mat-toolbar>

    <div
    *ngIf="currentRestaurant && !currentRestaurant.isActive && isMobile"
    class="flex items-center bg-orange-100 border border-orange-400 text-orange-700 rounded-md px-3 py-3 mx-2"
    >
    <mat-icon class="text-orange-500 mr-1">warning</mat-icon>
    <span class="text-sm">
      Your subscription has expired.
      <a
        routerLink="/pricing"
        class="font-semibold underline text-orange-600 hover:text-orange-800"
      >
        Renew now
      </a>
    </span>
  </div>
    <div
      class="h-full overflow-hidden"
      [ngClass]="{ 'md:mt-[75px]': isAuthenticated }"
    >
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
