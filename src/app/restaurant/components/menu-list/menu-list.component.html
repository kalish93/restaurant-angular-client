<div class="min-h-screen bg-gray-100 p-4">
  <div class="mx-auto md:max-w-[90%]">
    <header
      class="mb-10 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-6"
    >
      <div>
        <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">
          Our Menus 🍜
        </h1>
        <p class="mt-1 text-lg text-gray-500">
          Manage your restaurant menu items and categories
        </p>
      </div>
      <div class="flex flex-wrap justify-end gap-3">
        <ng-container *appHasRole="[hasManagerRole()]">
          <ng-container *appHasSubscription="['BASIC', 'STANDARD']">
            <button
              (click)="viewMenuQr()"
              class="flex items-center gap-2 rounded-xl bg-white px-4 sm:px-6 py-2 sm:py-3 font-medium text-green-600 shadow transition-all hover:shadow-md text-sm sm:text-base"
            >
              <mat-icon class="!text-xl">qr_code_2</mat-icon> Manage Menu QR
            </button>
          </ng-container>
        </ng-container>
        <button
          *appHasRole="[hasManagerRole()]"
          (click)="openCategoryManager()"
          class="flex items-center gap-2 rounded-xl bg-white px-5 py-3 font-semibold text-amber-700 shadow-md transition-all duration-300 hover:shadow-lg hover:bg-gray-50 text-base"
        >
          <mat-icon class="!text-xl">category</mat-icon> Manage Categories
        </button>
        <button
          *appHasRole="[hasManagerRole()]"
          (click)="openMenuModal()"
          class="flex items-center gap-2 rounded-xl bg-amber-600 px-5 py-3 font-semibold text-white shadow-lg shadow-amber-600/50 transition-all duration-300 hover:bg-amber-700 hover:shadow-xl hover:shadow-amber-700/50 text-base"
        >
          <mat-icon class="!text-xl">add_circle</mat-icon> Add Menu Item
        </button>
      </div>
    </header>
    <main
      class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
    >
      <mat-card
        *ngFor="let item of menus"
        class="group relative overflow-hidden rounded-xl bg-white shadow-xl hover:shadow-2xl transition-all duration-300 ease-in-out transform hover:-translate-y-1 p-5"
      >
        <div
          *ngIf="item.status === 'SOLD_OUT'"
          class="absolute top-3 right-3 z-10 p-1.5 bg-red-600 rounded-full"
        >
          <span class="text-xs font-bold text-white uppercase tracking-wider">
            OUT
          </span>
        </div>
        <div class="flex justify-center mb-4">
          <img
            [src]="getImageUrl(item.image)"
            alt="Photo of a menu item"
            class="h-28 w-28 object-cover rounded-full border-4 border-amber-500 shadow-lg transition-transform duration-300 group-hover:scale-105"
            (error)="onImageError($event)"
          />
        </div>
        <mat-card-header
          class="flex flex-col items-center text-center px-0 pt-0 pb-3 border-b border-gray-100"
        >
          <mat-card-title
            class="text-xl font-bold text-gray-900 truncate w-full mb-1"
          >
            {{ item.name }}
          </mat-card-title>
          <span class="text-lg font-extrabold text-amber-700 mt-1"
            >{{ item.price }} ETB</span
          >
        </mat-card-header>
        <mat-card-content class="px-0 py-3 text-gray-600">
          <p class="text-sm line-clamp-2 italic text-gray-500 text-center">
            {{ item.ingredients }}
          </p>
        </mat-card-content>
        <mat-card-actions
          class="flex flex-wrap gap-2 pt-3 justify-between items-center border-t border-gray-100"
        >
          <button
            *appHasRole="[hasManagerRole()]"
            (click)="confirmToggleAvailability(item)"
            [ngClass]="{
              'bg-gray-100 text-amber-600 hover:bg-gray-200':
                item.status === 'AVAILABLE',
              'bg-red-50 text-red-600 hover:bg-red-100':
                item.status === 'SOLD_OUT'
            }"
            class="flex items-center justify-center gap-1 px-3 py-2 rounded-lg text-sm font-semibold transition-all duration-200 shadow-sm flex-grow sm:flex-none sm:w-1/2"
          >
            <mat-icon class="!text-lg">
              {{
                item.status === "AVAILABLE" ? "visibility_off" : "visibility"
              }}
            </mat-icon>
            <span class="truncate">
              {{ item.status === "AVAILABLE" ? "Sold Out" : "Available" }}
            </span>
          </button>
          <div class="flex gap-2 justify-end flex-grow sm:flex-none">
            <button
              *appHasRole="[hasManagerRole()]"
              (click)="editMenuItem(item)"
              class="flex items-center justify-center gap-1 h-10 w-1/2 px-3 rounded-lg text-sm font-semibold text-blue-600 bg-blue-50 transition-all hover:bg-blue-100"
            >
              <mat-icon class="!text-base">edit</mat-icon>
            </button>
            <button
              *appHasRole="[hasManagerRole()]"
              (click)="deleteMenuItem(item)"
              class="flex items-center justify-center gap-1 h-10 w-1/2 px-3 rounded-lg text-sm font-semibold text-red-600 bg-red-50 transition-all hover:bg-red-100"
            >
              <mat-icon class="!text-base">delete</mat-icon>
            </button>
          </div>
        </mat-card-actions>
      </mat-card>
    </main>
    <div
      *ngIf="menus.length === 0"
      class="flex flex-col items-center justify-center py-24 bg-white rounded-xl shadow-lg mt-8"
    >
      <mat-icon class="!text-7xl mb-6 text-amber-400 opacity-70"
        >restaurant_menu</mat-icon
      >
      <h3 class="mb-2 text-2xl font-bold text-gray-800">
        No Menu Items Yet 😔
      </h3>
      <p class="text-gray-500 text-lg">
        It looks a little empty here. Click "Add Menu Item" to get started!
      </p>
    </div>
  </div>
</div>
